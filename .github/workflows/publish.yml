name: Publish npm build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.15.0"
          package-manager-cache: false

      - name: Install trusted-publishing-capable npm
        run: npm install --global npm@12.0.2

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify source
        run: npm run check

      - name: Prepare commit-addressed version
        id: version
        shell: bash
        run: |
          version="0.0.0-git.${GITHUB_SHA:0:12}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if ! npm view "${npm_package_name}" name --silent >/dev/null 2>&1; then
            echo "package_exists=false" >> "$GITHUB_OUTPUT"
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::${npm_package_name} does not exist yet; publish the first build manually."
            echo "## npm publish skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "Publish the first build manually, then configure npm Trusted Publishing and rerun this workflow." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "package_exists=true" >> "$GITHUB_OUTPUT"
          if npm view "${npm_package_name}@${version}" version --silent >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${npm_package_name}@${version} is already published."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            npm version "$version" --no-git-tag-version --ignore-scripts
          fi
        env:
          npm_package_name: "@thatrandomnerd69/pi-coding-agent"

      - name: Publish as latest
        if: steps.version.outputs.package_exists == 'true' && steps.version.outputs.exists == 'false'
        run: npm publish --tag latest --access public
