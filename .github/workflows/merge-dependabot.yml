name: Merge passing Pi updates

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
      REPOSITORY: ${{ github.repository }}
      TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Verify the update
        id: verify
        shell: bash
        run: |
          set -euo pipefail

          pr="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"
          test "$(jq -r .state <<<"$pr")" = "open"
          test "$(jq -r .user.login <<<"$pr")" = "dependabot[bot]"
          test "$(jq -r .head.sha <<<"$pr")" = "$TESTED_SHA"
          base_sha="$(jq -r .base.sha <<<"$pr")"

          mapfile -t changed_files < <(
            gh api --paginate "repos/$REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename'
          )
          test "${#changed_files[@]}" -gt 0
          for file in "${changed_files[@]}"; do
            case "$file" in
              package.json|package-lock.json) ;;
              *)
                echo "Refusing to merge a dependency PR that changes $file" >&2
                exit 1
                ;;
            esac
          done

          manifest="$(
            gh api \
              -H "Accept: application/vnd.github.raw+json" \
              "repos/$REPOSITORY/contents/package.json?ref=$TESTED_SHA"
          )"
          coding_agent_version="$(
            jq -r '.dependencies["@earendil-works/pi-coding-agent"] // empty' <<<"$manifest"
          )"
          tui_version="$(
            jq -r '.dependencies["@earendil-works/pi-tui"] // empty' <<<"$manifest"
          )"
          base_manifest="$(
            gh api \
              -H "Accept: application/vnd.github.raw+json" \
              "repos/$REPOSITORY/contents/package.json?ref=$base_sha"
          )"
          base_coding_agent_version="$(
            jq -r '.dependencies["@earendil-works/pi-coding-agent"] // empty' <<<"$base_manifest"
          )"
          base_tui_version="$(
            jq -r '.dependencies["@earendil-works/pi-tui"] // empty' <<<"$base_manifest"
          )"

          test -n "$coding_agent_version"
          test "$coding_agent_version" = "$tui_version"
          test -n "$base_coding_agent_version"
          test "$base_coding_agent_version" = "$base_tui_version"
          if [[ ! "$coding_agent_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Refusing to merge an unpinned Pi version: $coding_agent_version" >&2
            exit 1
          fi
          if [[ ! "$base_coding_agent_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Refusing to compare an unpinned base Pi version: $base_coding_agent_version" >&2
            exit 1
          fi

          IFS=. read -r base_major base_minor _ <<<"$base_coding_agent_version"
          IFS=. read -r target_major target_minor _ <<<"$coding_agent_version"
          if [[ "$base_major" != "$target_major" || "$base_minor" != "$target_minor" ]]; then
            echo "eligible=false" >>"$GITHUB_OUTPUT"
            echo "Pi $base_coding_agent_version to $coding_agent_version requires manual review." \
              >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "eligible=true" >>"$GITHUB_OUTPUT"

      - name: Squash-merge the tested commit
        if: steps.verify.outputs.eligible == 'true'
        shell: bash
        run: |
          set -euo pipefail

          result="$(
            gh api \
              --method PUT \
              "repos/$REPOSITORY/pulls/$PR_NUMBER/merge" \
              -f merge_method=squash \
              -f sha="$TESTED_SHA"
          )"
          test "$(jq -r .merged <<<"$result")" = "true"

      - name: Publish the merged build
        if: steps.verify.outputs.eligible == 'true'
        run: >-
          gh api
          --method POST
          "repos/$REPOSITORY/actions/workflows/publish.yml/dispatches"
          -f ref=main
