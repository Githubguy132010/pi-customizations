version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: daily
      time: "06:00"
      timezone: Europe/Amsterdam
    allow:
      - dependency-name: "@earendil-works/pi-coding-agent"
      - dependency-name: "@earendil-works/pi-tui"
    groups:
      pi:
        patterns:
          - "@earendil-works/pi-coding-agent"
          - "@earendil-works/pi-tui"
